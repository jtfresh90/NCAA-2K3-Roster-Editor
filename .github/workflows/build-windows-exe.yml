name: Build Windows EXE

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller pillow
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --noconfirm `
            --name "NCAA2K3-Roster-Editor" `
            --hidden-import PyQt5.sip `
            --collect-all PyQt5 `
            --add-data "team_names.txt;." `
            ncaa2k3_roster_editor_v2.py
      - name: Upload EXE as release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/NCAA2K3-Roster-Editor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCAA2K3-Roster-Editor-Windows
          path: dist/NCAA2K3-Roster-Editor.exe
